<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethereum Wallet Holdings Check — Education Demo</title>

<style>
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    min-height: 100%;
  }

  body {
    width: 640px;
    max-width: 90vw;
    margin: 60px auto;
    padding: 0 20px 60px;
    box-sizing: border-box;
  }

  * {
    box-sizing: border-box;
  }

  h1 {
    font-size: 1.4rem;
  }

  p.sub {
    color: #9aa0a6;
    margin-top: -8px;
    line-height: 1.5;
  }

  button {
    background: #4f7cff;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }

  button:disabled {
    background: #3a3d45;
    cursor: not-allowed;
  }

  #status {
    margin-top: 16px;
    color: #9aa0a6;
    font-size: 0.9rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .card {
    background: #1a1d24;
    border: 1px solid #2a2d35;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 20px;
  }

  .token-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    padding: 10px 0;
    border-bottom: 1px solid #2a2d35;
  }

  .token-row:last-child {
    border-bottom: none;
  }

  .token-name {
    min-width: 0;
  }

  .token-balance {
    text-align: right;
    white-space: nowrap;
  }

  .address {
    font-family: monospace;
    font-size: 0.75rem;
    color: #858b95;
    word-break: break-all;
    margin-top: 4px;
  }

  .warn {
    background: #2b1d1d;
    border: 1px solid #5c2b2b;
    color: #f2b8b8;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .error {
    color: #ff9b9b;
  }

  .muted {
    color: #9aa0a6;
  }

  code {
    color: #8fd1ff;
  }
</style>

</head>

<body>

<h1>What can someone see about your wallet?</h1>

<p class="sub">
  Ethereum Mainnet demo — connect your wallet to see some of the
  information already publicly visible to anyone before you ever sign anything.
</p>

<button id="connectBtn">Connect Wallet</button>

<div id="status"></div>

<div id="result"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>

<script>

/*
 * ============================================================
 * CONFIGURATION
 * ============================================================
 */

const ETHERSCAN_API_KEY = "R9QZAZG3G1286RTAZW391RIRPIKIT9E597";

const CHAIN_ID = 1;

const NETWORK_NAME = "Ethereum Mainnet";

const ETHERSCAN_API_URL =
  "https://api.etherscan.io/v2/api";

/*
 * Public Ethereum Mainnet RPC.
 *
 * This is used for:
 *
 *   - ETH balance
 *   - ERC-20 balanceOf()
 *   - ERC-20 symbol()
 *   - ERC-20 decimals()
 */
const RPC_URL =
  "https://ethereum-rpc.publicnode.com";


/*
 * Minimal ERC-20 ABI.
 */
const ERC20_ABI = [
  "function balanceOf(address owner) view returns (uint256)",
  "function symbol() view returns (string)",
  "function decimals() view returns (uint8)"
];


const connectBtn =
  document.getElementById("connectBtn");

const statusEl =
  document.getElementById("status");

const resultEl =
  document.getElementById("result");


connectBtn.addEventListener(
  "click",
  connectAndCheck
);


/*
 * ============================================================
 * CONNECT WALLET
 * ============================================================
 */

async function connectAndCheck() {

  resultEl.innerHTML = "";

  if (!window.ethereum) {

    statusEl.innerHTML = `
      <span class="error">
        No compatible wallet extension was detected.
      </span>
    `;

    return;
  }


  try {

    connectBtn.disabled = true;

    statusEl.textContent =
      "Requesting wallet connection...";


    /*
     * This opens the normal MetaMask connection prompt.
     *
     * It requests the PUBLIC wallet address only.
     *
     * No transaction is signed here.
     */
    const accounts =
      await window.ethereum.request({
        method: "eth_requestAccounts"
      });


    if (
      !accounts ||
      accounts.length === 0
    ) {

      throw new Error(
        "No wallet account was returned."
      );
    }


    const address =
      accounts[0];


    statusEl.textContent =
      `Connected: ${address}. Checking network...`;


    /*
     * Get currently selected chain.
     */
    const chainIdHex =
      await window.ethereum.request({
        method: "eth_chainId"
      });


    const chainId =
      parseInt(chainIdHex, 16);


    /*
     * Ethereum Mainnet = chain ID 1.
     */
    if (chainId !== CHAIN_ID) {

      statusEl.innerHTML = `
        <span class="error">
          Wrong network. Please switch MetaMask to
          ${NETWORK_NAME} and try again.
        </span>
      `;

      return;
    }


    statusEl.textContent =
      "Reading publicly available blockchain data...";


    await lookupHoldings(address);


    statusEl.textContent =
      `Done — public blockchain data associated with ${address} was read without requesting a transaction signature.`;


  } catch (err) {

    console.error(
      "Wallet connection error:",
      err
    );


    /*
     * MetaMask user rejected the connection.
     */
    if (err.code === 4001) {

      statusEl.innerHTML = `
        <span class="error">
          Wallet connection was rejected.
        </span>
      `;

    } else {

      statusEl.innerHTML = `
        <span class="error">
          Error:
          ${escapeHtml(
            err.message || "Unknown error"
          )}
        </span>
      `;
    }

  } finally {

    connectBtn.disabled = false;

  }
}


/*
 * ============================================================
 * LOOK UP WALLET HOLDINGS
 * ============================================================
 */

async function lookupHoldings(address) {


  /*
   * Connect to Ethereum Mainnet using a read-only provider.
   */
  const provider =
    new ethers.JsonRpcProvider(
      RPC_URL
    );


  // ==========================================================
  // 1. ETH BALANCE
  // ==========================================================

  statusEl.textContent =
    "Reading Ethereum ETH balance...";


  let ethBalance =
    "unavailable";


  try {

    const balanceWei =
      await provider.getBalance(
        address
      );


    ethBalance =
      ethers.formatEther(
        balanceWei
      );

  } catch (err) {

    console.error(
      "ETH balance lookup failed:",
      err
    );

  }


  // ==========================================================
  // 2. DISCOVER ERC-20 CONTRACTS USING ETHERSCAN
  // ==========================================================

  statusEl.textContent =
    "Discovering ERC-20 contracts associated with the address...";


  const tokenTxUrl =
    ETHERSCAN_API_URL +

    "?chainid=1" +

    "&module=account" +

    "&action=tokentx" +

    "&address=" +
    encodeURIComponent(address) +

    "&startblock=0" +

    "&endblock=99999999" +

    "&page=1" +

    "&offset=10000" +

    "&sort=asc" +

    "&apikey=" +
    encodeURIComponent(
      ETHERSCAN_API_KEY
    );


  let tokenData;


  try {

    const response =
      await fetch(
        tokenTxUrl
      );


    if (!response.ok) {

      throw new Error(
        `Etherscan returned HTTP ${response.status}`
      );
    }


    tokenData =
      await response.json();


    console.log(
      "Etherscan token response:",
      tokenData
    );


  } catch (err) {

    console.error(
      "Etherscan request failed:",
      err
    );


    resultEl.innerHTML = `

      <div class="card">

        <div class="token-row">

          <strong>
            Wallet Address
          </strong>

          <span class="address">
            ${escapeHtml(address)}
          </span>

        </div>


        <div class="token-row">

          <strong>
            Ethereum ETH Balance
          </strong>

          <span>
            ${escapeHtml(ethBalance)} ETH
          </span>

        </div>

      </div>


      <div class="warn">

        <strong>
          ERC-20 discovery failed.
        </strong>

        <br><br>

        The ETH balance was successfully read
        directly from Ethereum Mainnet, but the
        Etherscan token-discovery request failed.

        <br><br>

        Check DevTools → Console for the response.

      </div>

    `;

    return;
  }


  // ==========================================================
  // 3. VALIDATE ETHERSCAN RESPONSE
  // ==========================================================

  if (!Array.isArray(tokenData.result)) {

    console.error(
      "Unexpected Etherscan response:",
      tokenData
    );


    const errorMessage =
      typeof tokenData.result === "string"
        ? tokenData.result
        : tokenData.message ||
          "Unknown Etherscan response";


    resultEl.innerHTML = `

      <div class="card">

        <div class="token-row">

          <strong>
            Wallet Address
          </strong>

          <span class="address">
            ${escapeHtml(address)}
          </span>

        </div>


        <div class="token-row">

          <strong>
            Ethereum ETH Balance
          </strong>

          <span>
            ${escapeHtml(ethBalance)} ETH
          </span>

        </div>

      </div>


      <div class="warn">

        <strong>
          Etherscan token discovery returned an error.
        </strong>

        <br><br>

        ${escapeHtml(errorMessage)}

      </div>

    `;

    return;
  }



  // ==========================================================
  // 4. FIND UNIQUE ERC-20 CONTRACTS
  // ==========================================================

  const tokens =
    new Map();


  for (
    const tx of tokenData.result
  ) {

    if (
      !tx.contractAddress
    ) {
      continue;
    }


    const contractAddress =
      tx.contractAddress.toLowerCase();


    /*
     * Ignore the zero address.
     */
    if (
      contractAddress ===
      "0x0000000000000000000000000000000000000000"
    ) {
      continue;
    }


    /*
     * Store each unique token contract once.
     */
    tokens.set(
      contractAddress,
      {
        address:
          tx.contractAddress,

        symbol:
          tx.tokenSymbol ||
          "UNKNOWN",

        decimals:
          Number(
            tx.tokenDecimal
          )
      }
    );
  }


  console.log(
    "Unique ERC-20 contracts discovered:",
    [...tokens.values()]
  );



  // ==========================================================
  // 5. READ LIVE BALANCES DIRECTLY FROM EACH CONTRACT
  // ==========================================================

  statusEl.textContent =
    `Reading live balances for ${tokens.size} discovered token contract${tokens.size === 1 ? "" : "s"}...`;


  const tokenResults =
    await Promise.all(

      [...tokens.values()].map(
        async (info) => {

          try {

            const token =
              new ethers.Contract(
                info.address,
                ERC20_ABI,
                provider
              );


            /*
             * Read decimals directly from the contract.
             */
            let decimals;

            try {

              decimals =
                await token.decimals();

            } catch (_) {

              decimals =
                Number.isInteger(
                  info.decimals
                )
                  ? info.decimals
                  : 18;
            }


            /*
             * Read symbol directly from the contract.
             */
            let symbol;

            try {

              symbol =
                await token.symbol();

            } catch (_) {

              symbol =
                info.symbol ||
                "UNKNOWN";
            }


            /*
             * IMPORTANT:
             *
             * This is the LIVE balance directly from
             * the ERC-20 smart contract.
             */
            const balance =
              await token.balanceOf(
                address
              );


            const formatted =
              ethers.formatUnits(
                balance,
                decimals
              );


            return {

              address:
                info.address,

              symbol:
                symbol || "UNKNOWN",

              decimals,

              balance:
                formatted,

              success:
                true

            };


          } catch (err) {

            console.warn(
              `balanceOf() failed for ${info.address}:`,
              err
            );


            return {

              address:
                info.address,

              symbol:
                info.symbol ||
                "UNKNOWN",

              decimals:
                info.decimals,

              balance:
                "unreadable",

              success:
                false

            };
          }
        }
      )
    );



  // ==========================================================
  // 6. BUILD TOKEN DISPLAY
  // ==========================================================

  let tokenRowsHtml =
    "";


  for (
    const token of tokenResults
  ) {

    tokenRowsHtml += `

      <div class="token-row">

        <div class="token-name">

          <strong>
            ${escapeHtml(
              token.symbol
            )}
          </strong>

          <div class="address">

            ${escapeHtml(
              token.address
            )}

          </div>

        </div>


        <div class="token-balance">

          ${escapeHtml(
            token.balance
          )}

        </div>

      </div>

    `;
  }


  if (
    tokenResults.length === 0
  ) {

    tokenRowsHtml = `

      <div class="token-row">

        <span class="muted">

          No ERC-20 contracts were discovered
          through the configured Etherscan data source.

        </span>

      </div>

    `;
  }



  // ==========================================================
  // 7. DISPLAY EVERYTHING
  // ==========================================================

  resultEl.innerHTML = `

    <div class="card">


      <div class="token-row">

        <strong>
          Wallet Address
        </strong>

        <span class="address">

          ${escapeHtml(
            address
          )}

        </span>

      </div>


      <div class="token-row">

        <strong>
          Ethereum ETH Balance
        </strong>

        <span>

          ${escapeHtml(
            ethBalance
          )}
          ETH

        </span>

      </div>


      ${tokenRowsHtml}


    </div>


    <div class="warn">

      <strong>
        This is the point:
      </strong>

      The wallet address is public blockchain
      information.

      <br><br>

      This demo uses the address to discover
      ERC-20 contracts associated with it through
      public blockchain indexing data, then reads
      the current token balance directly from each
      ERC-20 contract using
      <code>balanceOf()</code>.

      <br><br>

      No private key is requested and no transaction
      is signed.

    </div>

  `;
}


/*
 * ============================================================
 * HTML ESCAPING
 * ============================================================
 */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
