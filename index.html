<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sepolia Wallet Holdings Check — Education Demo</title>

<style>
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    min-height: 100%;
  }

  body {
    width: 640px;
    max-width: 90vw;
    margin: 60px auto;
    padding: 0 20px 60px;
    box-sizing: border-box;
  }

  * {
    box-sizing: border-box;
  }

  h1 {
    font-size: 1.4rem;
  }

  p.sub {
    color: #9aa0a6;
    margin-top: -8px;
    line-height: 1.5;
  }

  button {
    background: #4f7cff;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }

  button:disabled {
    background: #3a3d45;
    cursor: not-allowed;
  }

  #status {
    margin-top: 16px;
    color: #9aa0a6;
    font-size: 0.9rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .card {
    background: #1a1d24;
    border: 1px solid #2a2d35;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 20px;
  }

  .token-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 10px 0;
    border-bottom: 1px solid #2a2d35;
  }

  .token-row:last-child {
    border-bottom: none;
  }

  .address {
    font-family: monospace;
    font-size: 0.8rem;
    word-break: break-all;
    text-align: right;
  }

  .warn {
    background: #2b1d1d;
    border: 1px solid #5c2b2b;
    color: #f2b8b8;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .error {
    color: #ff9b9b;
  }

  .muted {
    color: #9aa0a6;
  }
</style>
</head>

<body>

<h1>What can someone see about your wallet?</h1>

<p class="sub">
  Sepolia testnet demo — connect your wallet to see some of the information
  already publicly visible to anyone before you ever sign anything.
</p>

<button id="connectBtn">Connect Wallet</button>

<div id="status"></div>

<div id="result"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>

<script>

const ETHERSCAN_API_KEY = "R9QZAZG3G1286RTAZW391RIRPIKIT9E597";

const SEPOLIA_CHAIN_ID = 11155111;

const BASE_URL = "https://api.etherscan.io/v2/api";

const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";


const connectBtn = document.getElementById("connectBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");


connectBtn.addEventListener("click", connectAndCheck);


async function connectAndCheck() {

  resultEl.innerHTML = "";

  if (!window.ethereum) {

    statusEl.innerHTML =
      `<span class="error">
        No wallet extension detected.
      </span>`;

    return;
  }


  try {

    connectBtn.disabled = true;

    statusEl.textContent =
      "Requesting wallet connection...";


    /*
     * REAL MetaMask connection request.
     *
     * This gives the page the public wallet address.
     */
    const accounts =
      await window.ethereum.request({
        method: "eth_requestAccounts"
      });


    if (!accounts || accounts.length === 0) {

      throw new Error(
        "No wallet account was returned."
      );
    }


    const address = accounts[0];


    statusEl.textContent =
      `Connected: ${address}. Checking network...`;


    /*
     * Verify Sepolia.
     */
    const chainIdHex =
      await window.ethereum.request({
        method: "eth_chainId"
      });


    const chainId =
      parseInt(chainIdHex, 16);


    if (chainId !== SEPOLIA_CHAIN_ID) {

      statusEl.innerHTML =
        `<span class="error">
          Wrong network. Please switch MetaMask to Sepolia.
        </span>`;

      return;
    }


    statusEl.textContent =
      "Reading public blockchain data...";


    await lookupHoldings(address);


    statusEl.textContent =
      `Done — public blockchain data associated with ${address} was read without requesting a transaction signature.`;


  } catch (err) {

    console.error(err);


    if (err.code === 4001) {

      statusEl.innerHTML =
        `<span class="error">
          Wallet connection was rejected.
        </span>`;

    } else {

      statusEl.innerHTML =
        `<span class="error">
          Error: ${escapeHtml(
            err.message || "Unknown error"
          )}
        </span>`;
    }

  } finally {

    connectBtn.disabled = false;

  }
}



async function lookupHoldings(address) {

  /*
   * Public RPC.
   *
   * We use this to read:
   *
   *   - ETH balance
   *   - ERC-20 balanceOf()
   */
  const provider =
    new ethers.JsonRpcProvider(RPC_URL);


  const ERC20_ABI = [
    "function balanceOf(address) view returns (uint256)"
  ];



  // ============================================================
  // ETH BALANCE
  // ============================================================

  statusEl.textContent =
    "Reading Sepolia ETH balance...";


  let ethBalance = "unavailable";


  try {

    const balanceWei =
      await provider.getBalance(address);


    ethBalance =
      ethers.formatEther(balanceWei);

  } catch (err) {

    console.error(
      "ETH balance error:",
      err
    );

  }



  // ============================================================
  // ASK ETHERSCAN FOR EVERY ERC-20 TRANSFER
  // INVOLVING THIS ADDRESS
  // ============================================================

  statusEl.textContent =
    "Discovering ERC-20 contracts that have touched this address...";


  const tokenTxUrl =
    `${BASE_URL}` +
    `?chainid=${SEPOLIA_CHAIN_ID}` +
    `&module=account` +
    `&action=tokentx` +
    `&address=${encodeURIComponent(address)}` +
    `&startblock=0` +
    `&endblock=99999999` +
    `&page=1` +
    `&offset=10000` +
    `&sort=asc` +
    `&apikey=${encodeURIComponent(ETHERSCAN_API_KEY)}`;


  let tokenData;


  try {

    const response =
      await fetch(tokenTxUrl);


    if (!response.ok) {

      throw new Error(
        `Etherscan HTTP ${response.status}`
      );
    }


    tokenData =
      await response.json();


    console.log(
      "Etherscan token response:",
      tokenData
    );


  } catch (err) {

    console.error(
      "Etherscan request failed:",
      err
    );


    resultEl.innerHTML = `

      <div class="warn">

        <strong>Token discovery failed.</strong>

        <br><br>

        ETH balance was successfully read from Sepolia,
        but the ERC-20 indexer request failed.

        <br><br>

        Check the browser console for the Etherscan response.

      </div>

    `;

    return;
  }



  // ============================================================
  // IMPORTANT:
  // DON'T ASSUME result IS AN ARRAY
  // ============================================================

  if (!Array.isArray(tokenData.result)) {

    console.error(
      "Unexpected Etherscan response:",
      tokenData
    );


    resultEl.innerHTML = `

      <div class="card">

        <div class="token-row">

          <strong>Sepolia ETH Balance</strong>

          <span>
            ${escapeHtml(ethBalance)} ETH
          </span>

        </div>

      </div>


      <div class="warn">

        <strong>Etherscan token discovery returned an error.</strong>

        <br><br>

        ${escapeHtml(
          typeof tokenData.result === "string"
            ? tokenData.result
            : tokenData.message || "Unknown Etherscan response"
        )}

        <br><br>

        Open DevTools → Console to inspect the complete response.

      </div>

    `;

    return;
  }



  // ============================================================
  // DISCOVER UNIQUE TOKEN CONTRACTS
  // ============================================================

  const tokens = new Map();


  for (const tx of tokenData.result) {

    if (!tx.contractAddress) {
      continue;
    }


    const contractAddress =
      tx.contractAddress.toLowerCase();


    if (
      contractAddress ===
      "0x0000000000000000000000000000000000000000"
    ) {
      continue;
    }


    /*
     * Keep the metadata returned by Etherscan.
     */
    tokens.set(
      contractAddress,
      {
        address: tx.contractAddress,

        symbol:
          tx.tokenSymbol ||
          "UNKNOWN",

        decimals:
          Number.isFinite(
            Number(tx.tokenDecimal)
          )
            ? Number(tx.tokenDecimal)
            : 18
      }
    );
  }



  console.log(
    "Unique ERC-20 contracts discovered:",
    tokens
  );



  // ============================================================
  // READ LIVE BALANCE FROM EACH TOKEN CONTRACT
  // ============================================================

  const rows = [];


  /*
   * Query the contracts concurrently.
   *
   * This is much faster than waiting for every token
   * one-by-one.
   */
  const tokenResults =
    await Promise.all(

      [...tokens.values()].map(
        async (info) => {

          try {

            const token =
              new ethers.Contract(
                info.address,
                ERC20_ABI,
                provider
              );


            /*
             * LIVE ON-CHAIN BALANCE
             *
             * This is NOT taken from Etherscan.
             *
             * Etherscan only tells us which contracts
             * have interacted with the address.
             */
            const balance =
              await token.balanceOf(address);


            const formatted =
              ethers.formatUnits(
                balance,
                info.decimals
              );


            return {
              ...info,
              balance: formatted,
              success: true
            };


          } catch (err) {

            console.warn(
              `balanceOf() failed for ${info.address}`,
              err
            );


            return {
              ...info,
              balance: "unreadable",
              success: false
            };
          }
        }
      )
    );



  // ============================================================
  // DISPLAY TOKEN BALANCES
  // ============================================================

  for (const token of tokenResults) {

    rows.push(`

      <div class="token-row">

        <span>
          <strong>${escapeHtml(token.symbol)}</strong>
          <br>

          <span class="muted address">
            ${escapeHtml(token.address)}
          </span>
        </span>

        <span>
          ${escapeHtml(token.balance)}
        </span>

      </div>

    `);
  }



  let tokenRowsHtml;


  if (rows.length === 0) {

    tokenRowsHtml = `

      <div class="token-row">

        <span>
          No ERC-20 contracts were discovered
          through the configured Etherscan data source.
        </span>

      </div>

    `;

  } else {

    tokenRowsHtml =
      rows.join("");

  }



  // ============================================================
  // FINAL UI
  // ============================================================

  resultEl.innerHTML = `

    <div class="card">

      <div class="token-row">

        <strong>Wallet Address</strong>

        <span class="address">
          ${escapeHtml(address)}
        </span>

      </div>


      <div class="token-row">

        <strong>Sepolia ETH Balance</strong>

        <span>
          ${escapeHtml(ethBalance)} ETH
        </span>

      </div>


      ${tokenRowsHtml}

    </div>


    <div class="warn">

      <strong>This is the point:</strong>

      The wallet address is public blockchain information.

      The page uses the address to discover ERC-20 contracts
      associated with it and then reads the current balances
      directly from those contracts using <code>balanceOf()</code>.

      <br><br>

      No private key is requested and no transaction is signed.

    </div>

  `;
}



function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
