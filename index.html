<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sepolia Wallet Holdings Check — Education Demo</title>
<style>
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    min-height: 100%;
  }
  body {
    width: 640px;
    max-width: 90vw;
    margin: 60px auto;
    padding: 0 20px 60px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  h1 { font-size: 1.4rem; }
  p.sub { color: #9aa0a6; margin-top: -8px; }
  button {
    background: #4f7cff;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { background: #3a3d45; cursor: not-allowed; }
  #status { margin-top: 16px; color: #9aa0a6; font-size: 0.9rem; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2d35;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 20px;
  }
  .token-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2a2d35;
  }
  .token-row:last-child { border-bottom: none; }
  .warn {
    background: #2b1d1d;
    border: 1px solid #5c2b2b;
    color: #f2b8b8;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  code { color: #8fd1ff; }
</style>
</head>
<body>

<h1>What can someone see about your wallet?</h1>
<p class="sub">Sepolia testnet demo — connect your wallet to see exactly what's publicly visible to anyone, including scammers, before you ever sign anything.</p>

<button id="connectBtn">Connect Wallet</button>
<div id="status"></div>

<div id="result"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script>
  // Replace with your own free Etherscan API key (https://etherscan.io/myapikey)
  // Note: any key placed here is visible to anyone viewing this page's source.
  const ETHERSCAN_API_KEY = "YOUR_ETHERSCAN_API_KEY_HERE";
  const SEPOLIA_CHAIN_ID = 11155111;
  const BASE_URL = "https://api.etherscan.io/v2/api";
  const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";

  const connectBtn = document.getElementById("connectBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  connectBtn.addEventListener("click", connectAndCheck);

  async function connectAndCheck() {
    resultEl.innerHTML = "";
    if (!window.ethereum) {
      statusEl.textContent = "No wallet extension found. Install MetaMask to try this demo.";
      return;
    }

    try {
      connectBtn.disabled = true;
      statusEl.textContent = "Requesting wallet connection...";

      // This is the actual "Connect Wallet" moment — same prompt a real
      // phishing site would trigger, minus anything malicious after it.
      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      const address = accounts[0];

      statusEl.textContent = `Connected: ${address}. Checking Sepolia network...`;

      // Confirm the wallet is actually on Sepolia; most MetaMask setups
      // default to mainnet, and this demo only makes sense on testnet.
      const chainIdHex = await window.ethereum.request({ method: "eth_chainId" });
      if (parseInt(chainIdHex, 16) !== SEPOLIA_CHAIN_ID) {
        statusEl.textContent = "Please switch your wallet network to Sepolia and try again.";
        connectBtn.disabled = false;
        return;
      }

      statusEl.textContent = "Looking up public on-chain data for this address...";
      await lookupHoldings(address);

      statusEl.textContent = `Done — this is everything the chain already knew about ${address} before you clicked anything.`;
    } catch (err) {
      statusEl.textContent = `Something went wrong: ${err.message}`;
    } finally {
      connectBtn.disabled = false;
    }
  }

  async function lookupHoldings(address) {
    const provider = new ethers.JsonRpcProvider(RPC_URL);
    const ERC20_ABI = ["function balanceOf(address) view returns (uint256)"];

    // ETH balance
    const balUrl = `${BASE_URL}?chainid=${SEPOLIA_CHAIN_ID}&module=account&action=balance&address=${address}&tag=latest&apikey=${ETHERSCAN_API_KEY}`;
    const balRes = await fetch(balUrl);
    const balData = await balRes.json();
    const ethBalance = balData.status === "1" ? ethers.formatEther(balData.result) : "unavailable";

    // Every token contract that has ever sent tokens to this address
    const tokenTxUrl = `${BASE_URL}?chainid=${SEPOLIA_CHAIN_ID}&module=account&action=tokentx&address=${address}&sort=asc&apikey=${ETHERSCAN_API_KEY}`;
    const tokenRes = await fetch(tokenTxUrl);
    const tokenData = await tokenRes.json();

    const seen = new Map();
    for (const tx of tokenData.result || []) {
      if (!tx.contractAddress || tx.contractAddress === "0x0000000000000000000000000000000000000000") continue;
      seen.set(tx.contractAddress, { symbol: tx.tokenSymbol, decimals: Number(tx.tokenDecimal) });
    }

    let tokenRowsHtml = "";
    for (const [addr, info] of seen) {
      const token = new ethers.Contract(addr, ERC20_ABI, provider);
      let formatted = "?";
      try {
        const balance = await token.balanceOf(address);
        formatted = ethers.formatUnits(balance, info.decimals);
      } catch (e) {
        formatted = "unreadable";
      }
      tokenRowsHtml += `<div class="token-row"><span>${info.symbol}</span><span>${formatted}</span></div>`;
    }

    if (!tokenRowsHtml) {
      tokenRowsHtml = `<div class="token-row"><span colspan="2">No token transfers found for this address yet.</span></div>`;
    }

    resultEl.innerHTML = `
      <div class="card">
        <div class="token-row"><strong>ETH Balance</strong><span>${ethBalance} ETH</span></div>
        ${tokenRowsHtml}
      </div>
      <div class="warn">
        <strong>This is the point:</strong> everything shown above was retrieved using
        only your public wallet address — no private key, no signature, nothing you
        typed in. Anyone can look this up for any address, including someone deciding
        what to target before ever showing you a fake "Approve" button.
      </div>
    `;
  }
</script>

</body>
</html>
